<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Log de Simulación</title>
  <style>
    body { font-family: Arial; background: #1e1e1e; color: #ddd; padding: 20px; }
    table { border-collapse: collapse; width: 100%; background: #2c2c2c; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    th { background: #007acc; color: white; }
    tr:nth-child(even) { background: #252525; }
    input, select {
      padding: 6px;
      font-size: 15px;
      margin-top: 10px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }
    h1 { color: #6cf; }
  </style>
</head>
<body>
  <h1>Log de Simulación</h1>
  
  <label for="fileInput">Seleccioná tu archivo .log:</label>
  <input type="file" id="fileInput" accept=".log,.txt">

  <br>

  <label for="threadFilter">Filtrar por Thread:</label>
  <select id="threadFilter">
    <option value="all">Todos</option>
  </select>

  <br>

  <label for="textSearch">Buscar texto (Acción o Recurso):</label>
  <input type="text" id="textSearch" placeholder="Ej: mutex, montaña rusa, parque cerrado">

  <table id="logTable">
    <thead>
      <tr>
        <th>ID Thread</th>
        <th>Acción</th>
        <th>Recurso</th>
        <th>Hora</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const fileInput = document.getElementById("fileInput");
  const threadFilter = document.getElementById("threadFilter");
  const textSearch = document.getElementById("textSearch");
  const tbody = document.querySelector("#logTable tbody");

  let logEntries = [];
  let filteredEntries = [];

  const ROW_HEIGHT = 28; 
  const BUFFER = 10;

  // Creamos contenedor para virtual scroll
  const tableWrapper = document.createElement("div");
  tableWrapper.style.height = "600px";
  tableWrapper.style.overflowY = "auto";
  tableWrapper.style.position = "relative";

  const originalTable = document.getElementById("logTable");
  originalTable.parentNode.insertBefore(tableWrapper, originalTable);
  tableWrapper.appendChild(originalTable);

  // capa fantasma que simula altura real
  const spacer = document.createElement("div");
  spacer.style.position = "absolute";
  spacer.style.left = "0";
  spacer.style.right = "0";
  spacer.style.top = "0";
  spacer.style.height = "0";
  tableWrapper.appendChild(spacer);

  fileInput.addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      tbody.innerHTML = "";
      logEntries = [];
      threadFilter.innerHTML = '<option value="all">Todos</option>';

      const chunks = e.target.result.split("#").map(l => l.trim()).filter(l => l.length > 0);
      const threadsSet = new Set();

      chunks.forEach(line => {
        const parts = line.split("|").map(p => p.trim());
        if (parts.length === 4) {
          logEntries.push({
            thread: parts[0],
            action: parts[1],
            resource: parts[2],
            time: parts[3]
          });
          threadsSet.add(parts[0]);
        } else if (parts.length === 3) {
          logEntries.push({
            thread: parts[0],
            action: parts[1],
            resource: "",
            time: parts[2]
          });
          threadsSet.add(parts[0]);
        }
      });

      Array.from(threadsSet).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(thread => {
        const option = document.createElement("option");
        option.value = thread;
        option.textContent = thread;
        threadFilter.appendChild(option);
      });

      applyFilters();
    };
    reader.readAsText(file);
  });

  threadFilter.addEventListener("change", applyFilters);
  textSearch.addEventListener("input", applyFilters);

  function applyFilters() {
    const filterThread = threadFilter.value;
    const search = textSearch.value.trim().toLowerCase();

    filteredEntries = logEntries.filter(entry => {
      const matchThread = filterThread === "all" || entry.thread === filterThread;
      const matchText =
        entry.action.toLowerCase().includes(search) ||
        entry.resource.toLowerCase().includes(search);
      return matchThread && matchText;
    });

    spacer.style.height = (filteredEntries.length * ROW_HEIGHT) + "px";
    renderVisibleRows();
  }

  tableWrapper.addEventListener("scroll", renderVisibleRows);

  function renderVisibleRows() {
    const scrollTop = tableWrapper.scrollTop;

    const startIndex = Math.max(Math.floor(scrollTop / ROW_HEIGHT) - BUFFER, 0);
    const visibleCount = Math.ceil(tableWrapper.clientHeight / ROW_HEIGHT) + BUFFER * 2;
    const endIndex = Math.min(startIndex + visibleCount, filteredEntries.length);

    const fragment = document.createDocumentFragment();

    tbody.innerHTML = "";

    // Desplazamiento visual
    tbody.style.transform = `translateY(${startIndex * ROW_HEIGHT}px)`;

    for (let i = startIndex; i < endIndex; i++) {
      const entry = filteredEntries[i];
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${entry.thread}</td>
        <td>${entry.action}</td>
        <td>${entry.resource || "-"}</td>
        <td>${entry.time}</td>
      `;
      fragment.appendChild(tr);
    }

    tbody.appendChild(fragment);
  }
</script>

</body>
</html>
